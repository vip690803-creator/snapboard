<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<title>RADAR</title>
<!--
  publish_wrapper_template.html — 靜態快照密碼閘(publish_board.py 的模板)。
  頁面本體=整份看板 HTML 先 gzip 再 AES-256-GCM 加密後的密文(base64),
  瀏覽器端輸入密碼 → PBKDF2 導鑰 → 解密 → gunzip → document.write 呈現。
  網址公開、內容密文:沒密碼的人只看得到這個登入框。
  「記住這台裝置」= 把導出的 AES 鑰存 localStorage(不存密碼本身);
  鹽(salt)固定 → 換密文不換鑰,記住的裝置跨發佈仍可自動解鎖;改密碼即全部失效重問。
-->
<style>
  :root{  /* ⚠ 由 design_tokens.py 產出,勿手改;跑 sync_tokens.py 重生 */
  --bg:#06090d;  /* 快照外殼底 */
  --bg2:#0b1018;  /* 次底 */
  --bg3:#0f1620;  /* 卡片底 */
  --border:#2a3e54;  /* 邊線 */
  --border2:#3d5f86;  /* 亮邊線 */
  --text:#8aaccc;  /* 內文 */
  --dim:#3a5270;  /* 淡字 */
  --bright:#ddeeff;  /* 亮字 */
  --gold:#f0b840;  /* 品牌金(同報告) */
}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:14px}
  .gate{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;
    padding:28px 30px;width:min(92vw,360px);box-shadow:0 8px 30px rgba(0,0,0,.5)}
  h1{font-family:monospace;font-size:15px;color:var(--bright);letter-spacing:.18em;margin-bottom:4px}
  .sub{color:var(--dim);font-size:11.5px;margin-bottom:18px;font-family:monospace}
  input[type=password]{width:100%;background:var(--bg3);border:1px solid var(--border2);
    color:var(--bright);padding:9px 12px;border-radius:6px;font-size:15px;outline:none}
  input[type=password]:focus{border-color:var(--gold)}
  .row{display:flex;align-items:center;gap:8px;margin:12px 0}
  .row label{font-size:12px;color:var(--text);cursor:pointer;user-select:none}
  button{width:100%;background:rgba(240,184,64,.14);border:1px solid var(--gold);color:var(--gold);
    padding:9px;border-radius:6px;font-size:14px;cursor:pointer;font-weight:700}
  button:hover{background:rgba(240,184,64,.25)}
  button:disabled{opacity:.5;cursor:wait}
  .msg{font-size:12px;margin-top:10px;min-height:16px;color:var(--dim)}
  .msg.bad{color:#ff3f5e}
</style>
</head>
<body>
<div class="gate">
  <h1>RADAR</h1>
  <div class="sub">快照 <span id="pubts"></span></div>
  <input type="password" id="pw" placeholder="輸入密碼" autofocus autocomplete="current-password">
  <div class="row"><input type="checkbox" id="rm"><label for="rm">記住這台裝置(公用電腦別勾)</label></div>
  <button id="go">解鎖</button>
  <div class="msg" id="msg"></div>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function setMsg(t, bad){ const m=document.getElementById("msg"); m.textContent=t; m.className="msg"+(bad?" bad":""); }

async function deriveKey(pass){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(SALT), iterations:ITER, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function decryptShow(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(IV)}, key, b64(CT));
  const html = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  // 金鑰留在 window(document.write 換文件但 window 不換):看板內點報告 → 抓 b/*.bin 用它解密
  window.__BOARD_KEY__ = key;
  document.open(); document.write(html); document.close();
}
async function unlock(){
  const btn = document.getElementById("go");
  btn.disabled = true; setMsg("解鎖中…");
  try{
    const key = await deriveKey(document.getElementById("pw").value);
    if(document.getElementById("rm").checked){
      try{
        const raw = await crypto.subtle.exportKey("raw", key);
        localStorage.setItem("board_key", btoa(String.fromCharCode(...new Uint8Array(raw))));
      }catch(e){}
    }
    await decryptShow(key);   // 密碼錯 → decrypt 丟例外,落 catch
  }catch(e){
    setMsg("密碼錯誤", true); btn.disabled = false;
    try{ localStorage.removeItem("board_key"); }catch(_){}
  }
}
document.getElementById("go").onclick = unlock;
document.getElementById("pw").addEventListener("keydown", e => { if(e.key === "Enter") unlock(); });

// 環境檢查:WebCrypto 要安全來源(https/file),DecompressionStream 要 2023+ 瀏覽器
if(!window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined"){
  setMsg("此瀏覽器不支援解密(需較新版 Chrome/Edge/Safari/Firefox)", true);
}else{
  // 記住的裝置:localStorage 有鑰就直接試解(改過密碼會失敗 → 清掉回登入框)
  (async function(){
    const saved = localStorage.getItem("board_key");
    if(!saved) return;
    try{
      const key = await crypto.subtle.importKey("raw", b64(saved), {name:"AES-GCM"}, false, ["decrypt"]);
      setMsg("自動解鎖中…");
      await decryptShow(key);
    }catch(e){
      try{ localStorage.removeItem("board_key"); }catch(_){}
      setMsg("");
    }
  })();
}
</script>
